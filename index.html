<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loading</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #blankBtn { position: fixed; right: 8px; bottom: 8px; z-index: 10; opacity: .35;
              padding: 8px 12px; border: 0; border-radius: 6px; font: 14px sans-serif;
              background: #fff; color: #000; }
  #blankBtn:active, #blankBtn:focus { opacity: 1; }
</style>
</head>
<body>
<script>
  var URL_TO_LOAD = 'https://chromiumclient.com';
  var ALLOW = 'fullscreen; autoplay; clipboard-read; clipboard-write; pointer-lock';

  // 1) Always load the site right away in this page (this is the part that works everywhere)
  var frame = document.createElement('iframe');
  frame.allow = ALLOW;
  frame.allowFullscreen = true;
  frame.src = URL_TO_LOAD;
  document.body.appendChild(frame);

  // 2) Small button (bottom-right) to move it into an about:blank tab.
  //    It is a real tap, so the browser allows the new tab.
  var btn = document.createElement('button');
  btn.id = 'blankBtn';
  btn.textContent = 'about:blank';
  btn.onclick = function () {
    var w = window.open('about:blank', '_blank');
    if (!w) { btn.textContent = 'allow pop-ups'; return; }
    var d = w.document;
    d.title = 'Loading';
    d.body.style.cssText = 'margin:0;background:#000;overflow:hidden';
    var f = d.createElement('iframe');
    f.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0';
    f.allow = ALLOW;
    f.allowFullscreen = true;
    f.src = URL_TO_LOAD;
    d.body.appendChild(f);
    frame.remove();   // stop the duplicate copy in this tab
    btn.remove();
  };
  document.body.appendChild(btn);
</script>
</body>
</html>
