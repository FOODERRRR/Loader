<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loader</title>
<style>
  :root { --bg:#1d2a1f; --panel:#2b3a2d; --ink:#e8efe3; --mute:#9db39f; --acc:#7bc96f; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif;
         display: grid; place-items: center; }
  main { width: min(480px, 92vw); background: var(--panel); padding: 28px; border-radius: 10px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p { margin: 0 0 18px; color: var(--mute); }
  input[type=url] { width: 100%; padding: 10px 12px; border-radius: 6px; border: 2px solid #46604a;
         background: #1d2a1f; color: var(--ink); font: inherit; }
  input[type=url]:focus-visible, button:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
  label.opt { display: flex; gap: 8px; align-items: center; margin: 14px 0; color: var(--mute); }
  button { width: 100%; padding: 11px; border: 0; border-radius: 6px; background: var(--acc);
         color: #10200f; font: inherit; font-weight: 700; cursor: pointer; }
  #msg { margin-top: 12px; min-height: 1.4em; color: #f0b27a; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
</style>
</head>
<body>
<main id="ui">
  <h1>Client loader</h1>
  <p>Paste the address of the client you want to open.</p>
  <input id="url" type="url" placeholder="https://example.com/client/" autocomplete="off">
  <label class="opt"><input id="cloak" type="checkbox" checked> Open in an about:blank tab</label>
  <button id="go">Load</button>
  <div id="msg" role="status"></div>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var KEY = 'loader.url';

  function store(get, v) {
    try { return get ? localStorage.getItem(KEY) : localStorage.setItem(KEY, v); } catch (e) { return null; }
  }

  // Build the fullscreen frame inside any window/document
  function mount(win, url) {
    var d = win.document;
    d.title = 'Loading';
    d.body.style.cssText = 'margin:0;background:#000;overflow:hidden';
    d.body.innerHTML = '';
    var f = d.createElement('iframe');
    f.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0';
    f.allow = 'fullscreen; autoplay; clipboard-read; clipboard-write; pointer-lock';
    f.allowFullscreen = true;
    f.src = url;
    d.body.appendChild(f);
  }

  function valid(u) {
    try { var x = new URL(u); return x.protocol === 'https:' || x.protocol === 'http:'; } catch (e) { return false; }
  }

  function run() {
    var url = $('url').value.trim();
    if (!valid(url)) { $('msg').textContent = 'Enter a full address starting with https://'; return; }
    store(false, url);

    if ($('cloak').checked) {
      var w = window.open('about:blank', '_blank');
      if (!w) { $('msg').textContent = 'Pop-up blocked. Allow pop-ups for this page and try again.'; return; }
      mount(w, url);
    } else {
      mount(window, url);
    }
  }

  var DEFAULT_URL = 'https://chromiumclient.com';
  $('url').value = new URLSearchParams(location.search).get('u') || DEFAULT_URL;
  $('go').addEventListener('click', run);
  $('url').addEventListener('keydown', function (e) { if (e.key === 'Enter') run(); });
})();
</script>
</body>
</html>
